# BEGIN_KITTY_FONTS
font_family      JetBrainsMono
italic_font      auto
bold_font        auto
bold_italic_font auto

font_size 15

hide_window_decorations yes

enable_audio_bell no

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

shell_integration no-cursor
cursor_shape block
cursor_blink_interval 0
